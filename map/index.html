<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#172b3a">
	<title>LERN BHS</title>
	<link rel="preconnect" href="https://unpkg.com">
	<link rel="preconnect" href="https://tile.openstreetmap.org">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
	<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css">
	<link rel="stylesheet" href="./styles.css">
	<script type="importmap">
		{
			"imports": {
				"@maplibre/maplibre-gl-leaflet": "https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/dist/leaflet-maplibre-gl.mjs",
				"fflate": "https://unpkg.com/fflate@0.8.3/esm/browser.js",
				"leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
				"maplibre-gl": "https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs",
				"pmtiles": "https://unpkg.com/pmtiles@4.5.0/dist/esm/index.js"
			}
		}
	</script>
</head>
<body>
	<header class="topbar">
		<div class="brand-mark" aria-hidden="true">
			<svg viewBox="0 0 32 32" fill="none">
				<path d="M16 12.5v15m0-15c-2.1-5-8.9-6-10.1-2.6-1.2 3.4 2.6 5.5 6.8 6.1-3.5 1.8-5.5 5.3-3.2 7.3 2 1.8 4.7.7 6.5-2.4m0-8.4c2.1-5 8.9-6 10.1-2.6 1.2 3.4-2.6 5.5-6.8 6.1 3.5 1.8 5.5 5.3 3.2 7.3-2 1.8-4.7.7-6.5-2.4m-1.3-13.4-2.7-4m4 4 2.7-4m-6.5 9.1-3.4-1.4m9.8 1.4 3.4-1.4m-10.2 4.6-3.4.8m10.2-.8 3.4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
				<circle cx="16" cy="10.5" r="1.6" fill="currentColor"/>
			</svg>
		</div>
		<div class="brand-copy">
			<!-- <p class="eyebrow">LANCASHIRE · FIELD ATLAS</p> -->
			<h1>Lancashire BHS invertebrate benchmarking</h1>
		</div>
	</header>

	<main class="workspace">
		<aside class="sidebar" aria-label="Map controls">
			<!-- <section class="intro">
				<p class="eyebrow">EXPLORE THE LANDSCAPE</p>
				<h2>Sites &amp; recording grids</h2>
				<p>Choose a basemap and switch boundary layers on or off. Vector tiles load as you explore.</p>
			</section> -->

			<section class="control-section" aria-labelledby="basemap-heading">
				<div class="section-heading basemap-section-heading">
					<div>
						<h3 id="basemap-heading">Basemap</h3>
						<!-- <p>Choose your background</p> -->
					</div>
					<button id="recentre-map" class="recentre-button" type="button">Recentre</button>
				</div>
				<div class="choice-list" id="basemap-options"></div>
				<label class="choice-row basemap-greyscale-option" for="basemap-greyscale">
					<input id="basemap-greyscale" type="checkbox">
					<span>Greyscale</span>
				</label>
			</section>

			<div class="layer-groups">
				<section class="control-section layer-section" aria-labelledby="layers-heading">
					<button id="layers-toggle" class="section-heading layer-section-toggle" type="button"
						aria-expanded="true" aria-controls="layer-options">
						<span class="layer-section-heading-copy">
							<span class="layer-section-title" id="layers-heading" role="heading" aria-level="3">Analytical areas</span>
							<span class="layer-section-summary"><span id="selected-count">0</span> selected · drag rows to reorder, click swatch to restyle</span>
						</span>
						<span class="accordion-chevron" aria-hidden="true"></span>
					</button>
					<div class="layer-list" id="layer-options"></div>
				</section>

				<section class="control-section layer-section" aria-labelledby="bap-layers-heading">
					<button id="bap-layers-toggle" class="section-heading layer-section-toggle" type="button"
						aria-expanded="true" aria-controls="bap-layer-options">
						<span class="layer-section-heading-copy">
							<span class="layer-section-title" id="bap-layers-heading" role="heading" aria-level="3">BAP habitats</span>
							<span class="layer-section-summary"><span id="bap-selected-count">0</span> selected · drag rows to reorder, click swatch to restyle</span>
						</span>
						<span class="accordion-chevron" aria-hidden="true"></span>
					</button>
					<div class="layer-list" id="bap-layer-options"></div>
				</section>
			</div>

			<div class="sidebar-footer">
				<div class="status-indicator" aria-hidden="true"></div>
				<p id="map-status" role="status">Status good.</p>
			</div>
		</aside>

		<section class="map-shell" aria-label="Interactive map">
			<div id="map"></div>
			<div class="coordinate-readout" id="coordinates">54.05° N&nbsp; · &nbsp;2.80° W</div>
		</section>
	</main>

	<script type="module" src="./app.js"></script>
</body>
</html>
